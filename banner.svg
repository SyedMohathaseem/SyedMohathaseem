<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    
    <!-- Accent Teal/Blue Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="url(#bg-grad)" />
  <rect width="800" height="240" fill="url(#grid)" />

  <!-- Animated Glowing Spheres in Background -->
  <circle cx="700" cy="40" r="100" fill="#3b82f6" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="200" r="80" fill="#2dd4bf" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Abstract Line Art (Modern Network/Constellation theme) -->
  <path d="M-50,120 Q150,60 350,150 T750,110 T950,160" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-opacity="0.25" />
  <path d="M-50,140 Q170,190 400,90 T850,130" fill="none" stroke="url(#accent-grad)" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Content -->
  <!-- Main Name -->
  <text x="60" y="105" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1">
    SYED MOHATHASEEM
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="140" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="url(#accent-grad)" letter-spacing="2">
    AI FULL STACK DEVELOPER
  </text>
  
  <!-- Tagline / Focus -->
  <text x="60" y="175" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    Building Intelligent SaaS • Enterprise Web Architectures • AI Automation
  </text>

  <!-- Tech Dots / Visual accents on the right -->
  <g transform="translate(680, 115)">
    <circle cx="0" cy="0" r="6" fill="#2dd4bf" />
    <circle cx="20" cy="0" r="6" fill="#3b82f6" />
    <circle cx="40" cy="0" r="6" fill="#6366f1" />
    <text x="-10" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">SHIPPING DAILY</text>
  </g>
</svg>
